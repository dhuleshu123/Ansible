---
- name: Using Encrypted Secrets with Ansible Vault
  hosts: all
  become: true
  vars_files:
    - group_vars/all/vault.yml

  tasks:
    - name: Create application service user securely
      ansible.builtin.user:
        name: "{{ vault_db_user }}"
        password: "{{ vault_db_password | password_hash('sha512') }}"
        state: present

    - name: Write database credentials file securely (no_log hides output)
      ansible.builtin.copy:
        content: |
          DB_USER={{ vault_db_user }}
          DB_PASS={{ vault_db_password }}
        dest: /tmp/app_credentials.env
        mode: "0600"
      no_log: true
